name: Weekly Extra Catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: write

concurrency:
  group: tcgjson-extra-catalogs
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'KewaiiGamer/tcgjson'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Build Pokemon Japan
        run: tcgjson build --product-line 85 --output release --no-progress
      - name: Check the output
        run: >-
          python -c "import gzip,json;d=json.load(gzip.open('release/pokemon-japan.json.gz'));
          assert len(d['sets'])>50 and len(d['products'])>5000, (len(d['sets']),len(d['products']))"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="extra-$(date -u +%Y%m%d)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Extra catalogs $tag" --notes "Pokemon Japan (TCGplayer product line 85), built by tcgjson."
          gh release upload "$tag" release/pokemon-japan.json.gz --clobber
