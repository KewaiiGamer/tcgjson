name: Weekly Extra Catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: write

concurrency:
  group: tcgjson-extra-catalogs
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'KewaiiGamer/tcgjson'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Build Pokemon Japan
        run: tcgjson build --product-line 85 --output release --no-progress
      - name: Check the output
        run: >-
          python -c "import gzip,json;d=json.load(gzip.open('release/pokemon-japan.json.gz'));
          assert len(d['sets'])>50 and len(d['products'])>5000, (len(d['sets']),len(d['products']))"
      - name: Fetch PTCG-database (sparse, pinned in ptcg-database.lock)
        run: bash scripts/fetch_ptcg_database.sh ptcg-database
      - name: Download the previous release's language files (gates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'pokemon-*.json.gz' --dir previous || echo "no previous release files"
      - name: Update the TCGdex English snapshot (missing sets only, never fails)
        run: tcgjson tcgdex-snapshot --ptcg-root ptcg-database --snapshot data/tcgdex-en.json || true
      - name: Convert PTCG-database languages
        id: ptcg
        env:
          # Korean (ko) is paused pending the owner's decision on its linked_ja trainer links.
          PTCG_LANGUAGES: zh-tw,de,fr,es,it,pt
        run: |
          set -uo pipefail
          commit="$(sed -n 's/^commit=//p' ptcg-database.lock)"
          if tcgjson ptcg-build --ptcg-root ptcg-database --output release \
              --languages "$PTCG_LANGUAGES" --japan-catalog release/pokemon-japan.json.gz \
              --translations translations --tcgdex-snapshot data/tcgdex-en.json \
              --previous-dir previous --source-commit "$commit" --report release/.ptcg-report.json \
              | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "gates=ok" >> "$GITHUB_OUTPUT"
          else
            echo "gates=failed" >> "$GITHUB_OUTPUT"
            echo "::error::A PTCG language failed a hard gate or the converter failed; its file is not published"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="extra-$(date -u +%Y%m%d)"
          notes="Pokemon Japan (TCGplayer product line 85), built by tcgjson. Korean, Chinese (Traditional) and European languages converted from PTCG-database (https://github.com/type-null/PTCG-database, MIT License, Copyright (c) 2025 Weihang Ren) at commit $(sed -n 's/^commit=//p' ptcg-database.lock)."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Extra catalogs $tag" --notes "$notes"
          gh release upload "$tag" release/pokemon-*.json.gz --clobber
      - name: Fail when a language gate failed
        if: steps.ptcg.outputs.gates == 'failed'
        run: exit 1
